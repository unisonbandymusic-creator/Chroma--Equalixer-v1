name: Build VST3
on:
  push:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            extra: ""
          - os: macos-latest
            name: Mac
            extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.extra }}
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Chroma-Equalizer-${{ matrix.name }}-VST3
          path: build/ChromaEqualizer_artefacts/Release/VST3
